name: Nx Affected CI
inputs:
  parallel:
    required: false
    default: '3'
  tag:
    required: false
  tasks:
    required: true
  configuration:
    required: false
    default: 'ci'
  args:
    required: false
runs:
  using: "composite"
  steps:
    - name: Get last successful commit
      uses: nrwl/nx-set-shas@v4
    - name: Run affected command
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        TASKS: ${{ inputs.tasks }}
        PARALLEL: ${{ inputs.parallel }}
        TAG: ${{ inputs.tag }}
        ARGS: ${{ inputs.args }}
      run: npx nx affected --nxBail --configuration=$CONFIGURATION -t=$TASKS --parallel=$PARALLEL --exclude='*,!tag:$TAG' $ARGS